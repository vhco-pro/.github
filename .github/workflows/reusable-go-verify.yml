name: Reusable Go verification

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Caller module file declaring the Go toolchain
        type: string
        default: go.mod
      golangci-lint-config:
        description: Caller golangci-lint configuration
        type: string
        default: .golangci.yml
    outputs:
      go-version:
        description: Resolved Go toolchain version
        value: ${{ jobs.verify.outputs.go-version }}

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Format
        shell: bash
        run: |
          formatting=$(gofmt -l .)
          printf '%s\n' "$formatting"
          test -z "$formatting"
      - name: Tidy modules
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Verify lint configuration
        env:
          LINT_CONFIG: ${{ inputs.golangci-lint-config }}
        run: golangci-lint config verify --config "$LINT_CONFIG"
      - name: Lint
        env:
          LINT_CONFIG: ${{ inputs.golangci-lint-config }}
        run: golangci-lint run --config "$LINT_CONFIG"
