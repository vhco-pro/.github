name: Reusable CodeQL (JavaScript / TypeScript)

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated CodeQL language list"
        required: false
        type: string
        default: "javascript-typescript"


jobs:
  analyze:
    name: CodeQL analyze (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.languages }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:js-ts"
