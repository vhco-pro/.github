name: Reusable CodeQL (JavaScript / TypeScript)

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated CodeQL language list"
        required: false
        type: string
        default: "javascript-typescript"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ inputs.languages }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:js-ts"
