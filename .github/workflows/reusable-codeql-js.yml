name: Reusable CodeQL (JavaScript / TypeScript)

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated CodeQL language list"
        required: false
        type: string
        default: "javascript-typescript"


jobs:
  analyze:
    name: CodeQL analyze (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.languages }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:js-ts"
