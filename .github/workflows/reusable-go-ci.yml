name: Reusable Go checks and packaging

on:
  workflow_call:
    inputs:
      go-version-file:
        type: string
        default: go.mod
      golangci-lint-config:
        type: string
        default: .golangci.yml

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Go
        uses: michielvha/go-ci-action@bc485542c70d6cf51da9642c632ef268571597db # main
        with:
          go-version-file: ${{ inputs.go-version-file }}
          golangci-lint-config: ${{ inputs.golangci-lint-config }}
      - name: Test release packaging without publication or signing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish,sign

