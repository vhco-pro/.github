name: Reusable release

on:
  workflow_call:
    inputs:
      workflow-ref:
        description: Full commit SHA matching the caller's reusable workflow pin
        type: string
        required: true
      runs-on:
        description: Linux runner label
        type: string
        required: false
        default: ubuntu-latest
      dry-run:
        description: Render notes without creating tags or releases
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: Computed semantic version
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Exact tag pushed, empty when no tag was pushed
        value: ${{ jobs.release.outputs.tag }}
      tagged:
        description: Whether this run pushed a tag
        value: ${{ jobs.release.outputs.tagged }}
      release-url:
        description: Published release URL, empty on a dry run
        value: ${{ jobs.release.outputs.release-url }}

permissions: {}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.semVer }}
      tag: ${{ steps.version.outputs.pushed-tag }}
      tagged: ${{ steps.version.outputs.tagged }}
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require an immutable helper revision
        shell: bash
        env:
          WORKFLOW_REF: ${{ inputs.workflow-ref }}
        run: '[[ "$WORKFLOW_REF" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout shared helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vhco-pro/.github
          ref: ${{ inputs.workflow-ref }}
          path: .shared-release-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            release
      - name: Keep helper source outside caller checkout
        shell: bash
        env:
          SOURCE_DIRECTORY: .shared-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: mv "$SOURCE_DIRECTORY" "$RUNNER_TEMP/shared-release"
      - name: Compute version and exact tag
        id: version
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          prefix: v
          dry-run: ${{ inputs.dry-run }}
      - name: Select release range
        id: range
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.semVer }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: bash "$RUNNER_TEMP/shared-release/scripts/release/select-range.sh"
      - name: Install verified git-cliff
        shell: bash
        run: bash "$RUNNER_TEMP/shared-release/scripts/release/install-git-cliff.sh"
      - name: Render release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.range.outputs.tag }}
          RANGE: ${{ steps.range.outputs.range }}
          PREVIOUS_TAG: ${{ steps.range.outputs.previous-tag }}
          CONFIG_FILE: ${{ runner.temp }}/shared-release/release/cliff.toml
        run: bash "$RUNNER_TEMP/shared-release/scripts/release/render-notes.sh"
      - name: Publish release
        id: publish
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.range.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: bash "$RUNNER_TEMP/shared-release/scripts/release/publish-release.sh"