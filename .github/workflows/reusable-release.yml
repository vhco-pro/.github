name: Reusable release

on:
  workflow_call:
    inputs:
      runs-on:
        description: Linux runner label
        type: string
        required: false
        default: ubuntu-latest
      dry-run:
        description: Render notes without creating tags or releases
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: Computed semantic version
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Exact tag pushed, empty when no tag was pushed
        value: ${{ jobs.release.outputs.tag }}
      tagged:
        description: Whether this run pushed a tag
        value: ${{ jobs.release.outputs.tagged }}
      release-url:
        description: Published release URL, empty on a dry run
        value: ${{ jobs.release.outputs.release-url }}

permissions: {}

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.semVer }}
      tag: ${{ steps.version.outputs.pushed-tag }}
      tagged: ${{ steps.version.outputs.tagged }}
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute version and exact tag
        id: version
        uses: michielvha/gitversion-tag-action@7abd1474e38e32d39c5b04261749d0b9c0d37635
        with:
          prefix: v
          dry-run: ${{ inputs.dry-run }}
      - name: Select release range
        id: range
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.semVer }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if [[ "$DRY_RUN" == true ]]; then
            REVISION=$(git rev-parse HEAD)
          else
            REVISION=$(git rev-parse "refs/tags/$TAG^{commit}")
          fi
          PREVIOUS=""
          while IFS= read -r CANDIDATE; do
            if [[ "$CANDIDATE" != "$TAG" && "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              PREVIOUS="$CANDIDATE"
              break
            fi
          done < <(git for-each-ref --merged="$REVISION" --sort=-version:refname --format='%(refname:short)' refs/tags)
          RANGE="$REVISION"
          if [[ -n "$PREVIOUS" ]]; then
            RANGE="$PREVIOUS..$REVISION"
          fi
          printf 'tag=%s\nrange=%s\nprevious-tag=%s\n' "$TAG" "$RANGE" "$PREVIOUS" >> "$GITHUB_OUTPUT"
      - name: Install verified git-cliff
        shell: bash
        run: |
          set -euo pipefail
          VERSION=2.14.2
          case "$RUNNER_ARCH" in
            X64)
              TARGET=x86_64-unknown-linux-gnu
              CHECKSUM=26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
              ;;
            ARM64)
              TARGET=aarch64-unknown-linux-gnu
              CHECKSUM=fd27768ea76fea8c3ba3f3247fef2f6604988b629f15e48bf40be5eaa08b8fef2e4087cc9c8af16bc522bc19cc369611fa7692101b513f63469ad58522708600
              ;;
            *) echo "::error::Unsupported Linux runner architecture: $RUNNER_ARCH"; exit 1 ;;
          esac
          DIRECTORY="$RUNNER_TEMP/release-tools"
          mkdir -p "$DIRECTORY"
          ARCHIVE="$DIRECTORY/git-cliff.tar.gz"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v$VERSION/git-cliff-$VERSION-$TARGET.tar.gz" -o "$ARCHIVE"
          printf '%s  %s\n' "$CHECKSUM" "$ARCHIVE" | sha512sum --check --status
          tar -xzf "$ARCHIVE" -C "$DIRECTORY"
          install -m 0755 "$DIRECTORY/git-cliff-$VERSION/git-cliff" "$DIRECTORY/git-cliff"
          printf '%s\n' "$DIRECTORY" >> "$GITHUB_PATH"
      - name: Render release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.range.outputs.tag }}
          RANGE: ${{ steps.range.outputs.range }}
          PREVIOUS_TAG: ${{ steps.range.outputs.previous-tag }}
          CLIFF_CONFIG: |
            [changelog]
            header = ""
            body = """
            {% for group, commits in commits | group_by(attribute="group") %}
            ### {{ group | striptags | trim }}
            {% for commit in commits %}
            - {{ commit.message | split(pat="\n") | first | trim | upper_first }}
            {% endfor %}
            {% endfor %}
            """
            footer = ""
            trim = true
            [git]
            conventional_commits = true
            filter_unconventional = false
            filter_commits = false
            protect_breaking_commits = true
            tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
            sort_commits = "oldest"
            commit_parsers = [
              { message = "^chore\\(release\\)", skip = true },
              { message = "^Merge (branch|pull request|remote-tracking)", skip = true },
              { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
              { message = "^feat", group = "<!-- 1 -->Features" },
              { message = "^fix", group = "<!-- 2 -->Bug fixes" },
              { message = "^perf", group = "<!-- 3 -->Performance" },
              { message = "^refactor", group = "<!-- 4 -->Refactoring" },
              { message = "^revert", group = "<!-- 5 -->Reverts" },
              { message = "^docs", group = "<!-- 6 -->Documentation" },
              { message = "^test", group = "<!-- 7 -->Tests" },
              { message = "^(chore|ci|build|style)", group = "<!-- 8 -->Housekeeping" },
              { message = ".*", group = "<!-- 9 -->Other changes" },
            ]
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/release-cliff.toml"
          NOTES="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$CLIFF_CONFIG" > "$CONFIG"
          git-cliff --config "$CONFIG" --tag "$TAG" "$RANGE" > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            printf 'No commits in this release produced a note.\n' > "$NOTES"
          fi
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n**Full diff:** %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG" >> "$NOTES"
          fi
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          printf 'file=%s\n' "$NOTES" >> "$GITHUB_OUTPUT"
      - name: Publish release
        id: publish
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.range.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          RELEASES=$(gh api "repos/$GH_REPO/releases" --paginate)
          if printf '%s' "$RELEASES" | jq -e --arg tag "$TAG" '.[] | select(.tag_name == $tag)' >/dev/null; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" "${FLAGS[@]}"
          fi
          URL=$(gh release view "$TAG" --json url --jq .url)
          printf 'release-url=%s\n' "$URL" >> "$GITHUB_OUTPUT"