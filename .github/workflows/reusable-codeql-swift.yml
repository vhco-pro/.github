name: Reusable CodeQL (Swift)

# Swift extraction is only supported on macOS hosts, so this workflow runs on a
# macOS runner. That is free for public repositories on standard GitHub-hosted
# runners, but macOS minutes are billed at a premium on private ones and the
# concurrency pool is small — callers should trigger this on pull requests plus
# a weekly schedule rather than on every push.
#
# Advanced setup (rather than code scanning's default setup) is required for any
# repo whose .xcodeproj is generated by XcodeGen and gitignored: CodeQL's
# autobuild has nothing to build until `xcodegen generate` recreates it.

on:
  workflow_call:
    inputs:
      runner:
        description: "macOS runner label. Pin a specific image (e.g. macos-26) when the project needs a particular Xcode/Swift toolchain."
        required: false
        type: string
        default: macos-latest
      project:
        description: "Xcode project to build, relative to the repo root (e.g. 'ClaudeCompanion.xcodeproj')."
        required: true
        type: string
      scheme:
        description: "Xcode scheme to build (e.g. 'ClaudeCompanion')."
        required: true
        type: string
      xcodegen:
        description: "Run `xcodegen generate` before building. Required when the .xcodeproj is generated from project.yml and gitignored."
        required: false
        type: boolean
        default: true
      select-newest-xcode:
        description: "Select the newest Xcode installed on the runner. XcodeGen emits a recent project format that the runner's default Xcode can be too old to read."
        required: false
        type: boolean
        default: true
      package-resolved:
        description: "Path to a Package.resolved used as the SwiftPM source-cache key (e.g. 'CompanionKit/Package.resolved'). Empty disables the cache."
        required: false
        type: string
        default: ""
      derived-data-path:
        description: "Derived data path. Also where the SwiftPM source cache is restored."
        required: false
        type: string
        default: .build/DerivedData
      queries:
        description: "CodeQL query suite."
        required: false
        type: string
        default: security-extended

jobs:
  analyze:
    name: CodeQL analyze (Swift)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest installed Xcode
        if: inputs.select-newest-xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project (XcodeGen)
        if: inputs.xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      # Cache resolved SwiftPM dependency *sources* — not the build products, so
      # CodeQL still traces a full clean compile.
      - name: Cache SwiftPM sources
        if: inputs.package-resolved != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.derived-data-path }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: codeql-spm-${{ hashFiles(inputs.package-resolved) }}
          restore-keys: |
            codeql-spm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          queries: ${{ inputs.queries }}

      - name: Build (clean, unsigned — CodeQL traces the compile)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "${{ inputs.project }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination 'platform=macOS' \
            -derivedDataPath "${{ inputs.derived-data-path }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"
