name: Reusable Go release

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Go toolchain declaration in the caller checkout
        type: string
        default: go.mod
      golangci-lint-config:
        description: Caller lint configuration
        type: string
        default: .golangci.yml
    secrets:
      pgp-private-key:
        description: Artifact signing key
        required: true

permissions: {}

concurrency:
  group: go-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify Go
        id: ci
        uses: michielvha/go-ci-action@bc485542c70d6cf51da9642c632ef268571597db # main
        with:
          go-version-file: ${{ inputs.go-version-file }}
          golangci-lint-config: ${{ inputs.golangci-lint-config }}
      - name: Build, sign, and release
        uses: michielvha/goreleaser-action@503749900c38705309cf968298663349c9a2ed3c # main
        with:
          go-version: ${{ steps.ci.outputs.go-version }}
          github-token: ${{ github.token }}
          pgp-private-key: ${{ secrets.pgp-private-key }}
