name: Reusable GitVersion

# Permissions are inherited from the caller job, which picks the arrangement:
# - separate workflows: contents: read plus an App token, whose tag push starts
#   the tag-triggered release workflow;
# - same workflow: contents: write and no App, then a dependent release job
#   uses the tagged/tag outputs (a GITHUB_TOKEN tag push starts no workflow).

on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true
      config-file-path:
        description: Empty uses the GitVersion action's bundled configuration
        type: string
        default: ''
      release-app-client-id:
        description: Empty pushes tags with the caller's GITHUB_TOKEN
        type: string
        default: ''
    secrets:
      release-app-private-key:
        required: false
    outputs:
      tagged:
        description: Whether this run pushed a new exact tag
        value: ${{ jobs.version.outputs.tagged }}
      tag:
        description: The exact tag pushed by this run, or empty
        value: ${{ jobs.version.outputs.tag }}
      version:
        description: GitVersion SemVer for the checked commit
        value: ${{ jobs.version.outputs.version }}

concurrency:
  group: version-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tagged: ${{ steps.gitversion.outputs.tagged }}
      tag: ${{ steps.gitversion.outputs.pushed-tag }}
      version: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Authenticate for tag pushes
        id: app
        if: ${{ !inputs.dry-run && inputs.release-app-client-id != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.release-app-client-id }}
          private-key: ${{ secrets.release-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: ${{ !inputs.dry-run }}
      - name: Keep the checked source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::The branch advanced past the checked source. Run checks on the new commit."
            exit 1
          fi
      - name: Calculate version and optionally push its exact tag
        id: gitversion
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          prefix: v
          configFilePath: ${{ inputs.config-file-path }}
          dry-run: ${{ inputs.dry-run }}
