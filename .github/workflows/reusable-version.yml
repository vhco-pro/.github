name: Reusable GitVersion

on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: true
      config-file-path:
        description: Empty uses the GitVersion action's bundled configuration
        type: string
        default: ''
      release-app-client-id:
        type: string
        default: ''
    secrets:
      release-app-private-key:
        required: false

permissions: {}

concurrency:
  group: version-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Authenticate for tag pushes
        id: app
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.release-app-client-id }}
          private-key: ${{ secrets.release-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: ${{ !inputs.dry-run }}
      - name: Keep the checked source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::The branch advanced past the checked source. Run checks on the new commit."
            exit 1
          fi
      - name: Calculate version and optionally push its exact tag
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          prefix: v
          configFilePath: ${{ inputs.config-file-path }}
          dry-run: ${{ inputs.dry-run }}
