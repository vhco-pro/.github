name: Reusable CodeQL (Go)

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version (default 'stable' = latest released Go, so the analyzer never falls behind a repo's go.mod requirement)"
        required: false
        type: string
        default: "stable"
      build-mode:
        description: "CodeQL build mode for Go (autobuild | manual | none)"
        required: false
        type: string
        default: autobuild


jobs:
  analyze:
    name: CodeQL analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go
          build-mode: ${{ inputs.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:go"
