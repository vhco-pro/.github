name: Reusable CodeQL (Go)

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version (default 'stable' = latest released Go, so the analyzer never falls behind a repo's go.mod requirement)"
        required: false
        type: string
        default: "stable"
      go-version-file:
        description: >
          Path to a go.mod to read the toolchain from (e.g. "backend/go.mod"). Preferred over
          go-version: it tracks the module automatically, so the analyzer cannot drift out of
          lockstep with what the code actually requires. When set, it wins over go-version.
          Left empty by default because callers keep go.mod in different places (the Go
          satellites use backend/go.mod, zitadel-init uses the repo root), so there is no safe
          shared default.
        required: false
        type: string
        default: ""
      build-mode:
        description: "CodeQL build mode for Go (autobuild | manual | none)"
        required: false
        type: string
        default: autobuild


jobs:
  analyze:
    name: CodeQL analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go prefers go-version when both are supplied, which would silently defeat
          # go-version-file. Blank go-version out whenever a file is given so the file wins.
          go-version: ${{ inputs.go-version-file == '' && inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: ${{ inputs.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:go"
