name: Reusable CodeQL (Go)

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version (default 'stable' = latest released Go, so the analyzer never falls behind a repo's go.mod requirement)"
        required: false
        type: string
        default: "stable"
      build-mode:
        description: "CodeQL build mode for Go (autobuild | manual | none)"
        required: false
        type: string
        default: autobuild


jobs:
  analyze:
    name: CodeQL analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: go
          build-mode: ${{ inputs.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:go"
