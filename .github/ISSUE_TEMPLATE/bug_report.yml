name: Bug report
description: Report a problem with this project
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Share only information you can make public. Use synthetic values
        in your examples and remove credentials and identifying details.
        For a suspected vulnerability, follow the
        [security policy](https://github.com/vhco-pro/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps or conditions
      description: Give the shortest steps that show the problem. If it happened once, describe what you were doing when it occurred.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Release or revision
      description: Enter the version, release tag, or revision if you know it.

  - type: textarea
    id: error
    attributes:
      label: Error or status excerpt
      description: Paste only the relevant line or two. Replace identifying values with placeholders.
