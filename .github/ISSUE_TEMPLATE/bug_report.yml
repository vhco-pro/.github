name: Bug report
description: Report a reproducible defect in this project
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in
        as much detail as you can — the more reproducible the report,
        the faster a fix can land.

        **Security vulnerabilities**: do NOT file them here. Use
        [GitHub Private Vulnerability Reporting](https://github.com/vhco-pro/.github/blob/main/SECURITY.md)
        on this repository instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Concise description of the bug.
      placeholder: "When I do X, I expected Y, but Z happens instead."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        Minimal reproduction. Include the exact commands, configuration,
        or inputs that trigger the bug.
      placeholder: |
        1. Run `…`
        2. Do X in the UI / apply this config …
        3. Observe the error …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Version of this project you are running — a release tag, chart or
        image tag, app version, or commit SHA.
      placeholder: "e.g. v1.4.2, 5.6.9, or commit a1b2c3d"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        How and where you are running it. Include the OS, architecture,
        and any relevant runtime or platform.
      placeholder: "e.g. macOS 15.2 (Apple silicon), Helm on EKS 1.30, Ubuntu 24.04 + Docker 27"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant logs or error output (redact secrets!).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have removed any secrets from the logs and config I am sharing.
          required: true
