name: Feature request
description: Suggest a new feature or enhancement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        If this repository has Discussions, you can use it to discuss a
        substantial proposal before filing it.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and current pain.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share relevant public links or a synthetic example.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
