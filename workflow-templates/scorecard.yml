name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]


jobs:
  scorecard:
    uses: vhco-pro/.github/.github/workflows/reusable-scorecard.yml@main
    # Set to true once this satellite is public. Required for results to
    # appear on the OpenSSF Scorecard dashboard.
    with:
      publish_results: false
