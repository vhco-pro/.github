name: CodeQL (Go)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

# Least-privilege at top level. The job block below must still grant what the
# reusable needs: a called workflow can never hold more than the calling job.
permissions: {}


jobs:
  codeql:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@main
    permissions:
      security-events: write
      contents: read
      actions: read
