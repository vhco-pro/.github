name: CodeQL (Go)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

# Least-privilege at top level; reusable workflow raises per-job.
permissions: {}


jobs:
  codeql:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@main
