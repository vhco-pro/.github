name: CodeQL (Go)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

# Least-privilege at top level. The job block below must still grant what the
# reusable needs: a called workflow can never hold more than the calling job.
permissions: {}


jobs:
  codeql:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@de04290ceb4232e4ec50b4873712d76b1bf48aa6 # v1.0.0
    with:
      # Read the toolchain from the module so the analyzer never falls behind what the code
      # requires. CodeQL runs with GOTOOLCHAIN=local and cannot upgrade itself. Point this at
      # the go.mod of the module being analysed (for example backend/go.mod).
      go-version-file: go.mod
    permissions:
      security-events: write
      contents: read
      actions: read
