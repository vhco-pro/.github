[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
{% if not loop.first %}
{% endif %}\
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}\
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge (branch|pull request|remote-tracking)", skip = true },
  { message = "^(build|chore|fix)\\(deps(-dev)?\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^(docs|test|ci|style|chore)(\\([^)]+\\))?:", skip = true },
  { message = "(?i)^(update|create) readme\\.md(\\s|$)", skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = ".*", group = "<!-- 9 -->Other changes" },
]